<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8fafc;
    color:#0f172a;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

h1{
    margin-bottom:25px;
}

.table-wrap{
    overflow-x:auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#1e293b;
    color:#fff;
    padding:16px;
    text-align:left;
}

td{
    padding:14px 16px;
    border-bottom:1px solid #e5e7eb;
    vertical-align:top;
}

tr:hover{
    background:#f8fafc;
}

.empty{
    background:#fff;
    padding:40px;
    border-radius:20px;
    text-align:center;
    color:#64748b;
}
</style>
</head>
<body>

<div class="container">

<h1>Заявки с сайта</h1>

<div class="table-wrap">
<table id="requestsTable">
<thead>
<tr>
<th>Дата</th>
<th>Имя</th>
<th>Email</th>
<th>Телефон</th>
<th>Сообщение</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div id="empty" class="empty" style="display:none;">
Заявок пока нет
</div>

</div>

<script>
fetch('requests.php')
.then(response => response.json())
.then(data => {

    const tbody = document.querySelector('#requestsTable tbody');
    const empty = document.getElementById('empty');

    if (!data.length) {
        document.querySelector('.table-wrap').style.display = 'none';
        empty.style.display = 'block';
        return;
    }

    data.forEach(row => {

        tbody.innerHTML += `
        <tr>
            <td>${row.date || ''}</td>
            <td>${row.name || ''}</td>
            <td>${row.email || ''}</td>
            <td>${row.phone || ''}</td>
            <td>${row.message || ''}</td>
        </tr>
        `;
    });

});
</script>

</body>
</html>
